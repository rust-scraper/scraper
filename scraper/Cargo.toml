[package]
name = "scraper"
version = "0.29.0"
edition = "2024"

description = "HTML parsing and querying with CSS selectors"
categories = ["web-programming", "text-processing"]
keywords = ["html", "css", "selector", "scraping"]

authors = ["June McEnroe <june@causal.agency>"]
license = "ISC"

repository = "https://github.com/rust-scraper/scraper"
readme = "README.md"

[dependencies]
cssparser = "0.38.0"
ego-tree = "0.11.0"
html5ever = "0.40.0"
indexmap = { version = "2.14.0", optional = true }
precomputed-hash = "0.1.1"
selectors = "0.41.0"
serde = { version = "1.0.228", optional = true }

[dependencies.getopts]
version = "0.2.24"
optional = true

[features]
default = ["main", "errors"]
deterministic = ["dep:indexmap"]
main = ["dep:getopts"]
atomic = []
errors = []
serde = ["dep:serde"]

[lints.rust]
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"

default_trait_access = "allow"
manual_let_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
should_panic_without_expect = "allow"
similar_names = "allow"

[[bin]]
name = "scraper"
path = "src/main.rs"
required-features = ["main"]
